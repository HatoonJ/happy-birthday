<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <rect width="220" height="220" fill="#0d1117"/>
  <rect x="10" y="10" width="200" height="200" fill="none" stroke="#4ad9ff" stroke-width="2" stroke-dasharray="6 6" opacity="0.3"/>

  <!-- shoulders -->
  <path d="M45 205 C45 155 175 155 175 205 Z" fill="#1c2a33" stroke="#39ff9c" stroke-width="3"/>

  <!-- headset band -->
  <path d="M68 78 C68 40 152 40 152 78" stroke="#4ad9ff" stroke-width="6" fill="none" stroke-linecap="round"/>
  <rect x="58" y="75" width="16" height="26" rx="6" fill="#4ad9ff"/>
  <rect x="146" y="75" width="16" height="26" rx="6" fill="#4ad9ff"/>
  <path d="M150 98 C150 118 132 126 122 128" stroke="#4ad9ff" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="122" cy="128" r="4" fill="#4ad9ff"/>

  <!-- head -->
  <circle cx="110" cy="95" r="42" fill="#1c2a33" stroke="#39ff9c" stroke-width="3"/>

  <!-- glasses -->
  <rect x="80" y="88" width="24" height="18" rx="6" fill="none" stroke="#39ff9c" stroke-width="3"/>
  <rect x="116" y="88" width="24" height="18" rx="6" fill="none" stroke="#39ff9c" stroke-width="3"/>
  <line x1="104" y1="96" x2="116" y2="96" stroke="#39ff9c" stroke-width="3"/>

  <!-- smile -->
  <path d="M96 118 Q110 130 124 118" stroke="#39ff9c" stroke-width="4" fill="none" stroke-linecap="round"/>

  <text x="110" y="205" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#4ad9ff">reem.jpg</text>
