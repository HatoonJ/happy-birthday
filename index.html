<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #1b1030 0%, #22283a 100%);
    color: #fff9f0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  main {
    text-align: center;
    padding: 24px;
  }
  h1 {
    font-weight: 700;
    margin-bottom: 28px;
  }
  .cards {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  a.card {
    display: block;
    width: 180px;
    padding: 28px 18px;
    border-radius: 16px;
    text-decoration: none;
    font-weight: 700;
    font-size: 1.1rem;
    color: inherit;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  a.card:hover {
    transform: translateY(-4px);
    background: rgba(255,255,255,0.12);
  }
  .emoji { font-size: 2rem; display: block; margin-bottom: 10px; }
</style>
</head>
<body>
<main>
  <h1>🎉 Happy Birthday 🎉</h1>
  <div class="cards">
    <a class="card" href="yara/">
      <span class="emoji">🎈</span>
      Yara's page
    </a>
    <a class="card" href="reem/">
      <span class="emoji">💻</span>
      Reem's page
    </a>
  </div>
</main>
</body>
</html>
